<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RockPaperScissors</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <header>
        <h1>RockPaperScissors</h1>
    </header>
    <main>
        <div class="results">
            <div class="resultsText">You: <span class="result-score" data-your-score>0</span></div>
            <div class="resultsText" data-final-column>Computer: <span class="result-score" data-computer-score>0</span></div>
        </div>
        <div class="selections">
            <button class="selection" data-selection="rock">✊</button>
            <button class="selection" data-selection="paper">✋</button>
            <button class="selection" data-selection="scissors">✌</button>
        </div>
    </main>
    <footer>
        <p>Modifed by <a href="https://github.com/synvior">Synvior</a></p>
    </footer>
</body>
<script src="app.js"></script>
</html>
